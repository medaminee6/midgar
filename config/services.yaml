# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    uploads_directory: '%kernel.project_dir%/public/uploads'
    user_photos_directory: '%kernel.project_dir%/public/uploads/avatars'
    avatars_directory: '%kernel.project_dir%/public/uploads/avatars'
    app_base_url: 'http://127.0.0.1:8000'
    hf_token: '%env(HF_TOKEN)%'
services:
    # Default configuration for services in this file
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $appBaseUrl: '%app_base_url%'

    # Makes classes in src/ available to be used as services
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Service AI

    App\Service\ImageGenerator:
        arguments:
            $hfToken: '%hf_token%'


    # Service GeminiPro
    
    # Avatar generator alias → local implementation

